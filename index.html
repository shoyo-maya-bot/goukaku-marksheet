<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="AWS SAA・AI Practitioner・生成AI Developer Pro・応用情報技術者試験の入門レッスン、図解、要点ノート、解説付き問題と初見模試。">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>合格マークシート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Layout: 答案用紙のような1カラム。上に資格の切替、下に「受験票」ヘッダー＋タブ。選択肢はマークシートの楕円で塗る。 */
:root{
  --paper:#f3f5f8;          /* 用紙の地（やや青みのグレー） */
  --sheet:#ffffff;          /* カード面 */
  --ink:#1b2333;            /* 本文インク */
  --ink-2:#55617a;          /* 補助テキスト */
  --rule:#d9dfe9;           /* 罫線 */
  --mark:#2a4bb0;           /* マークシートの青インク＝アクセント */
  --mark-soft:#e3e9fa;
  --red:#d2332f;            /* 赤ペン採点 */
  --red-soft:#fbe7e6;
  --ok:#1f7a52;
  --ok-soft:#e1f2ea;
  --warn:#a86a00;
  --warn-soft:#fbf0d9;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151d;--sheet:#1a202b;--ink:#e6eaf2;--ink-2:#9aa5ba;--rule:#2c3443;
  --mark:#8aa6ff;--mark-soft:#22305a;--red:#ff7a72;--red-soft:#3d1f20;
  --ok:#5fd3a0;--ok-soft:#173327;--warn:#f2b44c;--warn-soft:#3a2d12;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151d;--sheet:#1a202b;--ink:#e6eaf2;--ink-2:#9aa5ba;--rule:#2c3443;
  --mark:#8aa6ff;--mark-soft:#22305a;--red:#ff7a72;--red-soft:#3d1f20;
  --ok:#5fd3a0;--ok-soft:#173327;--warn:#f2b44c;--warn-soft:#3a2d12;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
strong{font-weight:700;background:linear-gradient(transparent 62%,var(--mark-soft) 62%)}

/* masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 0 14px;border-bottom:2px solid var(--ink)}
.mast h1{font-size:26px;font-weight:900;letter-spacing:.02em}
.mast h1 span{color:var(--mark)}
.mast p{margin:0;font-size:13px;color:var(--ink-2)}
.homebtn{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 14px;font-size:13px}

/* home */
.lead{margin:18px 0 6px;font-size:14px;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.ticket{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.ticket:hover{border-color:var(--mark)}
.ticket .code{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);letter-spacing:.06em}
.ticket h2{font-size:19px}
.ticket .tag{font-size:13px;color:var(--ink-2);line-height:1.6}
.ticket .perf{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);gap:8px}
.trow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;min-width:0}
.trow .code{min-width:0}
.order{flex:none;white-space:nowrap;font-family:var(--f-mono);font-size:11px;color:var(--mark);border:1px solid var(--mark);border-radius:999px;padding:0 8px}
.meter{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:var(--mark)}
.meter .line{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--red)}
.loading{padding:40px 0;color:var(--ink-2)}

/* cert header = 受験票 */
.admit{margin-top:18px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.admit h2{font-size:21px}
.admit .code{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);letter-spacing:.06em}
.ready{text-align:right;min-width:0}
.ready b{font-family:var(--f-mono);font-size:28px;font-weight:600;line-height:1}
.ready small{display:block;font-size:11px;color:var(--ink-2)}
@media (max-width:520px){.admit{grid-template-columns:1fr}.ready{text-align:left}}

.tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 12px;font-size:14px;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mark);font-weight:700}
.panel{padding-top:16px;display:flex;flex-direction:column;gap:14px}

.box{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;min-width:0}
.box h3{font-size:16px;margin-bottom:8px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 18px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:11px;color:var(--ink-2);letter-spacing:.08em}
.facts dd{margin:0;font-weight:500}
.dombar{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:6px 0 10px;border:1px solid var(--rule)}
.dombar span{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:#fff;min-width:0;overflow:hidden}
.domlist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.domlist li{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:baseline;font-size:14px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.plan{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.plan li{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:10px 0;border-top:1px dashed var(--rule)}
.plan li:first-child{border-top:0}
.plan .wk{font-family:var(--f-mono);font-size:12px;color:var(--mark);padding-top:2px}
.plan ul{margin:4px 0 0;padding-left:18px;font-size:14px;color:var(--ink-2)}

/* notes */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:3px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.note{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);min-width:0}
.note summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.note summary::-webkit-details-marker{display:none}
.note .dtag{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:0 5px}
.note h3{font-size:15px;font-weight:700}
.note .done{font-size:12px;color:var(--ok);font-weight:700}
.note .body{padding:0 14px 14px;border-top:1px solid var(--rule)}
.note ul.pts{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tbl{overflow-x:auto;margin-top:12px}
.tbl table{border-collapse:collapse;font-size:13px;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--paper);font-weight:700;white-space:nowrap}
.check{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--ink-2)}
.check input{width:18px;height:18px;accent-color:var(--ok)}
.progressline{font-size:13px;color:var(--ink-2)}

/* traps */
.traps{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.traps li{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.traps li:first-child{border-top:0}
.traps .cue{font-weight:500}
.traps .ans{color:var(--mark)}
.traps .ans.hide{color:transparent;background:var(--mark-soft);border-radius:4px;cursor:pointer;user-select:none}
@media (max-width:520px){.traps li{grid-template-columns:1fr;gap:2px}}

/* practice menu */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.mode{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.mode:hover:not(:disabled){border-color:var(--mark)}
.mode:disabled{opacity:.45;cursor:not-allowed}
.mode b{font-family:var(--f-display);font-size:15px}
.mode span{font-size:12px;color:var(--ink-2);line-height:1.6}
.mode.primary{border-color:var(--mark);background:var(--mark-soft)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{font:inherit;padding:4px 8px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink)}

/* question */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.qno{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.timer{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.timer.low{color:var(--red)}
.qtext{font-size:16px;line-height:1.85;white-space:pre-wrap}
.pick{font-size:12px;color:var(--mark);font-weight:700}
.choices{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.choice{width:100%;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:10px 12px;min-width:0}
.choice:hover:not(:disabled){border-color:var(--mark)}
.choice:disabled{cursor:default}
.bubble{width:30px;height:20px;border:1.5px solid var(--ink-2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:var(--ink-2);margin-top:3px}
.choice.sel .bubble{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .bubble{border-color:var(--ok)}
.choice.wrong{border-color:var(--red);background:var(--red-soft)}
.verdict{display:flex;align-items:center;gap:12px}
.stamp{width:54px;height:54px;border-radius:50%;border:3px solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:900;font-size:26px;transform:rotate(-8deg);flex:none}
.stamp.x{border-radius:8px}
.exp{border-left:3px solid var(--red);padding:2px 0 2px 12px;font-size:14px;white-space:pre-wrap}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--mark);background:var(--mark);color:var(--sheet);border-radius:8px;padding:8px 16px;font-weight:700}
.btn.ghost{background:var(--sheet);color:var(--mark)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.flag{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:2px 10px;font-size:12px}
.flag[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots button{width:26px;height:22px;border:1px solid var(--rule);background:var(--sheet);border-radius:4px;font-family:var(--f-mono);font-size:10px;padding:0}
.dots button.ans{background:var(--mark-soft);border-color:var(--mark)}
.dots button.cur{outline:2px solid var(--mark)}
.dots button.flagged{border-color:var(--warn)}

/* results */
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--f-mono);font-size:44px;font-weight:600;line-height:1}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ng{background:var(--red-soft);color:var(--red)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.drows{display:flex;flex-direction:column;gap:10px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:13px}
.drow .lbl{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px;min-width:0}
.drow .lbl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.drow .lbl span:last-child{white-space:nowrap;flex:none}
.drow .pct{font-family:var(--f-mono);text-align:right}
.review{display:flex;flex-direction:column;gap:6px}
.review details{border-top:1px solid var(--rule);padding-top:6px}
.review summary{cursor:pointer;font-size:14px}
.empty{padding:14px;border:1px dashed var(--rule);border-radius:var(--r);color:var(--ink-2);font-size:14px}
.foot{margin-top:28px;font-size:12px;color:var(--ink-2)}
.danger{border:1px solid var(--rule);background:none;border-radius:6px;padding:2px 10px;font-size:12px;color:var(--ink-2)}
/* 入門 */
.lessons{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.lesson{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);min-width:0}
.lesson summary{list-style:none;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.lesson summary::-webkit-details-marker{display:none}
.lno{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--mark);color:var(--mark);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.lesson.done .lno{background:var(--mark);color:var(--sheet)}
.lesson h3{font-size:15px}
.lesson .body{padding:4px 14px 16px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:12px}
.analogy{background:var(--mark-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.analogy b{font-family:var(--f-display);font-size:12px;color:var(--mark);display:block;letter-spacing:.06em}
.lesson p{margin:0}
.terms{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:4px 14px;margin:0;font-size:14px}
.terms dt{font-weight:700;font-family:var(--f-mono);font-size:13px;padding-top:1px}
.terms dd{margin:0;color:var(--ink-2)}
@media (max-width:520px){.terms{grid-template-columns:1fr}.terms dd{margin-bottom:6px}}
.sum{border-left:3px solid var(--mark);padding-left:12px;font-weight:500}
.mini{border:1px dashed var(--rule);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mini .choice{padding:8px 10px}
.links{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2)}
.term{border:0;background:none;padding:0;color:inherit;font:inherit;text-decoration:underline dotted var(--mark);text-underline-offset:3px;text-decoration-thickness:1.5px;cursor:help}
.tip{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:2px solid var(--mark);box-shadow:0 -6px 20px rgba(0,0,0,.12);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tip .in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.tip b{font-family:var(--f-display);font-size:16px}
.tip p{margin:0;grid-column:1/-1;font-size:14px}
.gsearch{width:100%;font:inherit;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink)}
.gloss{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.gloss li{padding:10px 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:12px}
.gloss li:first-child{border-top:0}
.gloss .t{font-weight:700}
.gloss .a{font-size:11px;color:var(--ink-2);font-family:var(--f-mono)}
@media (max-width:520px){.gloss li{grid-template-columns:1fr;gap:2px}}
.hint{font-size:13px;color:var(--ink-2);background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 12px}
/* 図解 */
.fig{margin:4px 0 0;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);overflow:hidden;min-width:0}
.fig .fhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--paper)}
.fig .fhead b{font-family:var(--f-display);font-size:13px;color:var(--mark);letter-spacing:.06em;flex:none}
.fig .fhead span{font-size:13px;font-weight:700;min-width:0}
.fig .fsvg{padding:10px 8px 4px;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto;font-family:var(--f-body)}
.fig .fcap{padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px}
.fig .ftext{font-size:14px;min-height:3.2em}
.fig .fctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fig .fctl button{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:3px 10px;font-size:13px}
.fig .fctl button.pri{background:var(--mark);border-color:var(--mark);color:var(--sheet);font-weight:700}
.fig .fctl button:disabled{opacity:.4;cursor:default}
.fig .fdots{display:flex;gap:4px;margin-left:auto}
.fig .fdots i{width:8px;height:8px;border-radius:50%;background:var(--rule)}
.fig .fdots i.on{background:var(--mark)}
/* 図の部品（SVGの中で使う） */
.f-box{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.f-box2{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.5}
.f-zone{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:6 4}
.f-zone2{fill:var(--mark-soft);stroke:var(--mark);stroke-width:1.5}
.f-pub{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.5}
.f-priv{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.5}
.f-ngz{fill:var(--red-soft);stroke:var(--red);stroke-width:1.5}
.f-t{fill:var(--ink);font-size:14px}
.f-ts{fill:var(--ink-2);font-size:12px}
.f-tb{fill:var(--ink);font-size:14px;font-weight:700}
.f-tm{fill:var(--mark);font-size:13px;font-weight:700}
.f-tok{fill:var(--ok);font-size:13px;font-weight:700}
.f-tng{fill:var(--red);font-size:13px;font-weight:700}
.f-line{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.f-flow{fill:none;stroke:var(--mark);stroke-width:2.5}
.f-ok{fill:none;stroke:var(--ok);stroke-width:2.5}
.f-ng{fill:none;stroke:var(--red);stroke-width:2.5;stroke-dasharray:5 4}
.f-ah{fill:var(--ink-2)}.f-ahm{fill:var(--mark)}.f-ahok{fill:var(--ok)}.f-ahng{fill:var(--red)}
.f-dot{fill:var(--mark)}
.f-hide{opacity:0;pointer-events:none}
.fig [data-s]{transition:opacity .35s}
@media (prefers-reduced-motion:no-preference){
  .fig .now .f-flow,.fig .now.f-flow,.fig .now .f-ok,.fig .now.f-ok{stroke-dasharray:8 6;animation:fflow 1s linear infinite}
  @keyframes fflow{to{stroke-dashoffset:-14}}
  .fig .now .f-dot,.fig .now.f-dot{animation:fpulse 1.2s ease-in-out infinite}

}

@media (prefers-reduced-motion:no-preference){.stamp{animation:stamp .18s ease-out}@keyframes stamp{from{transform:rotate(-8deg) scale(1.5);opacity:0}}}
</style>

<body>

<script>
(function(){
const ORDER=["saa","aif","aip","ap"];
const ORDERNOTE={saa:"まずここ",aif:"2番目",aip:"上級",ap:"国家資格"};
// 模試: 本番の「1問あたり時間」に合わせる（SAA 130分/65問, AIF 90分/65問, AIP 180分/75問, AP科目A 150分/80問）
const MOCK={saa:{n:50,secPerQ:120},aif:{n:40,secPerQ:83},aip:{n:45,secPerQ:144},ap:{n:60,secPerQ:112}};
const PASSLINE=0.8;// 練習で80%を超えたら本番合格圏の目安
const PAL=["#2a4bb0","#3f8f7a","#b4672a","#8a4fa8","#c0434a","#5a6b85","#2f8fb8"];
const CERTS=window.CERTS||{};
const app=document.getElementById("app");
const $=(s,r=document)=>r.querySelector(s);

/* ---------- storage ---------- */
function load(id){try{const s=localStorage.getItem("gms:"+id);return s?JSON.parse(s):null}catch(e){return null}}
function save(id,st){try{localStorage.setItem("gms:"+id,JSON.stringify(st))}catch(e){}}
const mem={};
function st(id){if(!mem[id])mem[id]=Object.assign({q:{},notes:{},flags:{},mocks:[],lessons:{}},load(id)||{});return mem[id]}
function persist(id){save(id,st(id))}

/* ---------- helpers ---------- */
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function rich(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")}
const INTRO=window.INTRO||{};
const GL={};// id -> {re, map}
function gloss(cid){
  if(GL[cid]!==undefined)return GL[cid];
  const g=(INTRO[cid]&&INTRO[cid].glossary)||[];if(!g.length)return GL[cid]=null;
  const map=new Map();g.forEach(e=>{[e.term,...(e.alias||[])].forEach(k=>{if(k&&k.length>1&&!map.has(k))map.set(k,e)})});
  const keys=[...map.keys()].sort((a,b)=>b.length-a.length).map(k=>{const x=esc(k).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return /^[\x00-\x7f]/.test(k)?"(?<![A-Za-z0-9])"+x+"(?![A-Za-z0-9])":x});
  return GL[cid]={re:new RegExp(keys.join("|"),"g"),map:new Map([...map].map(([k,v])=>[esc(k),v]))};
}
// 用語に点線を付け、タップで説明。seen に入った用語は2回目以降リンクしない
function rt(s,cid,seen){const h=rich(s);const G=gloss(cid);if(!G)return h;
  return h.split(/(<[^>]+>)/).map(part=>part.startsWith("<")?part:part.replace(G.re,m=>{const e=G.map.get(m);if(!e||seen&&seen.has(e.term))return m;if(seen)seen.add(e.term);
    return `<button type="button" class="term" data-g="${esc(e.term)}">${m}</button>`})).join("")}
document.addEventListener("click",ev=>{const b=ev.target.closest&&ev.target.closest(".term");if(!b)return;ev.preventDefault();ev.stopPropagation();
  const g=(INTRO[view.cert]&&INTRO[view.cert].glossary)||[];const e=g.find(x=>x.term===b.dataset.g);if(!e)return;
  $("#tipT").textContent=e.term;$("#tipP").innerHTML=rich(e.plain);$("#tip").hidden=false},true);
$("#tipX").onclick=()=>{$("#tip").hidden=true};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#tip").hidden=true});
const LET="ABCDEFGH";
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function same(a,b){if(a.length!==b.length)return false;const x=[...a].sort(),y=[...b].sort();return x.every((v,i)=>v===y[i])}
function domColor(c,did){const i=c.domains.findIndex(d=>d.id===did);return PAL[(i<0?0:i)%PAL.length]}
function domName(c,did){const d=c.domains.find(d=>d.id===did);return d?d.name:did}

function stats(c){
  const s=st(c.id);let seen=0,lastOk=0;const per={};
  c.domains.forEach(d=>per[d.id]={n:0,seen:0,ok:0});
  c.questions.forEach(q=>{const r=s.q[q.id];const p=per[q.domain];if(p)p.n++;if(r){seen++;if(p)p.seen++;if(r.last){lastOk++;if(p)p.ok++}}});
  // 合格可能性: 分野の配点で重み付けした「直近正解率」。未着手分野は0扱い。
  let wsum=0,score=0;c.domains.forEach(d=>{const p=per[d.id];wsum+=d.weight;score+=d.weight*(p.n?p.ok/p.n:0)});
  const ready=wsum?score/wsum:0;
  const notesDone=c.notes.filter((n,i)=>s.notes[i]).length;
  return {seen,lastOk,total:c.questions.length,per,ready,notesDone};
}

/* ---------- routing ---------- */
let view={cert:null,tab:"intro"};
let session=null; // 解答中のセッション
let timerId=null;
function go(cert,tab){view={cert,tab:tab||"intro"};session=null;stopTimer();
  try{if(cert)history.replaceState(null,"","#"+cert);else history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  render();window.scrollTo(0,0)}
$("#homeBtn").onclick=()=>go(null);
$("#resetBtn").onclick=function(){
  if(this.dataset.armed){const id=view.cert;mem[id]={q:{},notes:{},flags:{},mocks:[],lessons:{}};persist(id);this.dataset.armed="";this.textContent="この資格の記録をリセット";render();return}
  this.dataset.armed="1";this.textContent="もう一度押すとリセットします";setTimeout(()=>{this.dataset.armed="";this.textContent="この資格の記録をリセット"},4000)};

function render(){
  const c=view.cert&&CERTS[view.cert];
  $("#homeBtn").hidden=!c;$("#resetBtn").hidden=!c;
  if(!c){renderHome();return}
  if(session){renderSession(c);return}
  renderCert(c);
}

/* ---------- home ---------- */
function renderHome(){
  const list=ORDER.filter(id=>CERTS[id]);
  if(!list.length){app.innerHTML='<div class="empty" style="margin-top:20px">学習データを読み込めませんでした。ページを再読み込みしてください。</div>';return}
  app.innerHTML='<p class="lead">G検定の次に取る4資格。おすすめは左上から順番です。まずは各資格の「はじめて」タブから。カードの青いバーは「分野の配点で重み付けした直近正解率」、赤い線は合格圏の目安（80%）です。</p><div class="grid">'+
  list.map(id=>{const c=CERTS[id],s=stats(c);const pct=Math.round(s.ready*100);
    return `<button class="ticket" data-id="${id}">
      <span class="trow"><span class="code">${esc(c.code)}</span><span class="order">${ORDERNOTE[id]||""}</span></span>
      <h2>${esc(c.name)}</h2>
      <span class="tag">${esc(c.tagline)}</span>
      <span class="meter" aria-label="合格圏まで ${pct}%"><i style="width:${pct}%"></i><span class="line" style="left:${PASSLINE*100}%"></span></span>
      <span class="perf"><span>到達度 <b class="mono">${pct}%</b></span><span class="mono">問題 ${s.seen}/${s.total}・ノート ${s.notesDone}/${c.notes.length}</span></span>
    </button>`}).join("")+'</div>';
  app.insertAdjacentHTML("beforeend",`<section class="box" style="margin-top:18px">
    <h3>このサイトだけで合格できる？</h3>
    <p style="margin:0 0 10px">「絶対」とは言えませんが、このサイトだけで合格を狙える量と質にしてあります。試験範囲の全分野を本番レベルの問題でカバーし、公式情報で事実確認しています。使うときに知っておいてほしいことが3つあります。</p>
    <ul style="margin:0 0 12px;padding-left:18px;display:flex;flex-direction:column;gap:6px">
      <li><b>本番の問題は公開されていない</b>：各資格250〜310問を本番レベルで作っていますが、本番と同じ問題が出るわけではありません。答えを覚えるのではなく、解説で「なぜその選択肢か」を理解することが大事です。</li>
      <li><b>模試は初見の問題だけで出す</b>：一部の問題を模試専用に取ってあり、練習には出しません。初見の模試で80%以上を2回出せれば、合格の可能性はかなり高いと言えます。</li>
      <li><b>非公式の教材</b>：公式の問題とは書き方や難しさが違います。サービスの仕様が変わることもあります。</li>
    </ul>
    <p style="margin:0 0 8px"><b>おすすめの使い方</b>：「はじめて」→ ノート → 練習問題を全部解く → 間違えた問題を解説つきで解き直す → 初見の模試。下の公式教材は、余裕があれば仕上げの確認に使ってください（必須ではありません）。</p>
    <div class="tbl"><table><thead><tr><th>資格</th><th>仕上げに使える公式・定番教材（任意）</th><th>受験してよい目安</th></tr></thead><tbody>
      <tr><td>SAA</td><td>AWS Skill Builder の公式練習問題・公式模擬試験（無料のものあり）。無料枠でVPC・EC2・S3を実際に触る</td><td>初見の公式問題で7〜8割</td></tr>
      <tr><td>AI Practitioner</td><td>Skill Builder の公式練習問題。Bedrockの画面を一度触る</td><td>初見の公式問題で7〜8割</td></tr>
      <tr><td>生成AI Dev Pro</td><td>Skill Builder の公式練習問題・模擬試験。Bedrockで小さなRAGやエージェントを実際に作る</td><td>初見の公式問題で8割</td></tr>
      <tr><td>応用情報</td><td>過去問（「応用情報技術者試験ドットコム」の過去問道場など）を数年分。CBTの問題は非公開なので、公開済みの過去問が主な教材になる</td><td>初見の過去問で科目A 7割、科目B 6割以上</td></tr>
    </tbody></table></div>
  </section>`);
  app.querySelectorAll(".ticket").forEach(b=>b.onclick=()=>go(b.dataset.id));
}

/* ---------- cert ---------- */
const TABS=[["intro","はじめて"],["figs","図解"],["notes","要点ノート"],["glossary","用語集"],["traps","ひっかけ"],["practice","問題演習"],["report","成績"],["overview","試験情報"]];
function renderCert(c){
  const s=stats(c),pct=Math.round(s.ready*100);
  const state=pct>=PASSLINE*100?'<span class="pill ok">合格圏</span>':pct>=60?'<span class="pill mid">あと一歩</span>':'<span class="pill ng">学習中</span>';
  app.innerHTML=`<section class="admit">
    <div><div class="code">${esc(c.code)}</div><h2>${esc(c.name)}</h2><div class="muted" style="font-size:13px">${esc(c.tagline)}</div></div>
    <div class="ready"><b>${pct}<span style="font-size:14px">%</span></b><small>到達度 ${state}</small></div>
  </section>
  <nav class="tabs" role="tablist">${TABS.filter(([k])=>k!=="figs"||(FIGS[c.id]||[]).length).map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${view.tab===k}">${l}</button>`).join("")}</nav>
  <section class="panel" id="panel"></section>`;
  app.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view.tab=b.dataset.t;renderCert(c)});
  const p=$("#panel");
  $("#tip").hidden=true;
  ({intro:tabIntro,figs:tabFigs,glossary:tabGlossary,overview:tabOverview,notes:tabNotes,traps:tabTraps,practice:tabPractice,report:tabReport})[view.tab](c,p,s);
}

function tabOverview(c,p){
  const e=c.exam||{};
  const facts=[["問題数",e.questions],["試験時間",e.time],["合格ライン",e.pass],["受験料",e.fee],["出題形式",e.format]].filter(f=>f[1]);
  p.innerHTML=`<div class="box"><h3>試験の基本情報</h3>
    <dl class="facts">${facts.map(f=>`<div><dt>${f[0]}</dt><dd>${esc(f[1])}</dd></div>`).join("")}</dl>
    ${e.note?`<p class="muted" style="font-size:13px;margin:10px 0 0">${rich(e.note)}</p>`:""}</div>
  <div class="box"><h3>出題分野と配点</h3>
    <div class="dombar">${c.domains.map(d=>`<span style="width:${d.weight}%;background:${domColor(c,d.id)}">${d.weight}%</span>`).join("")}</div>
    <ul class="domlist">${c.domains.map(d=>`<li><span class="sw" style="background:${domColor(c,d.id)}"></span><span>${esc(d.name)}</span><span class="mono muted">${d.weight}%</span></li>`).join("")}</ul></div>
  <div class="box"><h3>合格までの学習プラン</h3>
    <ol class="plan">${(c.plan||[]).map(w=>`<li><span class="wk">${esc(w.label)}</span><div><b>${rich(w.title)}</b><ul>${(w.items||[]).map(i=>`<li>${rich(i)}</li>`).join("")}</ul></div></li>`).join("")}</ol></div>`;
}

function tabIntro(c,p){
  const I=INTRO[c.id];const S=st(c.id);S.lessons=S.lessons||{};
  if(!I||!I.lessons){p.innerHTML='<div class="empty">入門レッスンを準備中です。</div>';return}
  const done=I.lessons.filter((l,i)=>S.lessons[i]).length;
  p.innerHTML=`<div class="row" style="justify-content:space-between"><span class="muted" style="font-size:13px">前提知識ゼロから、要点ノートが読めるところまで。上から順に読んでください。</span><span class="progressline">読了 <b class="mono">${done}/${I.lessons.length}</b></span></div>
  <ol class="lessons" id="ls"></ol>`;
  const box=$("#ls",p);
  I.lessons.forEach((l,i)=>{
    const li=document.createElement("li");const d=document.createElement("details");d.className="lesson"+(S.lessons[i]?" done":"");
    if(openLesson===null&&!S.lessons[i]&&I.lessons.findIndex((x,j)=>!S.lessons[j])===i)d.open=true;
    const ck=l.check;
    d.innerHTML=`<summary><span class="lno">${i+1}</span><h3>${esc(l.title)}</h3><span class="done" style="font-size:12px;color:var(--ok);font-weight:700">${S.lessons[i]?"✓ 読了":""}</span></summary>
    <div class="body">
      ${l.analogy?`<div class="analogy"><b>たとえると</b>${rich(l.analogy)}</div>`:""}
      ${(l.body||[]).map(x=>`<p>${rich(x)}</p>`).join("")}
      ${figsFor(c.id,"lesson",i).map(figHTML).join("")}
      ${(l.terms||[]).length?`<dl class="terms">${l.terms.map(t=>`<dt>${esc(t.term)}</dt><dd>${rich(t.plain)}</dd>`).join("")}</dl>`:""}
      ${l.summary?`<p class="sum">${rich(l.summary)}</p>`:""}
      ${ck?`<div class="mini"><b style="font-size:13px">確認問題</b><div>${rich(ck.q)}</div><ul class="choices">${ck.choices.map((x,k)=>`<li><button class="choice" data-k="${k}"><span class="bubble">${LET[k]}</span><span>${rich(x)}</span></button></li>`).join("")}</ul><div class="exp" hidden></div></div>`:""}
      <div class="links">${(l.notes||[]).filter(t=>c.notes.some(n=>n.title===t)).map(t=>`<button class="chip" data-n="${esc(t)}">ノート：${esc(t)}</button>`).join("")}</div>
      <div class="btns"><button class="btn" data-done>${S.lessons[i]?"読了を取り消す":"わかった、次へ"}</button></div>
    </div>`;
    d.querySelectorAll(".mini .choice").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;d.querySelectorAll(".mini .choice").forEach((x,j)=>{x.disabled=true;if(j===ck.answer)x.classList.add("right");else if(j===k)x.classList.add("wrong")});
      const e=d.querySelector(".mini .exp");e.hidden=false;e.innerHTML=(k===ck.answer?"<b>正解。</b>":"<b>おしい。</b>")+rich(ck.exp||"")});
    d.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{openNote=b.dataset.n;noteFilter="all";view.tab="notes";renderCert(c)});
    d.querySelector("[data-done]").onclick=()=>{S.lessons[i]=!S.lessons[i];if(!S.lessons[i])delete S.lessons[i];persist(c.id);tabIntro(c,p);
      const nx=p.querySelectorAll(".lesson")[i+1];if(S.lessons[i]&&nx){nx.open=true;nx.scrollIntoView({block:"start"})}};
    figInit(d,c.id);
    if(openLesson===i){d.open=true;setTimeout(()=>d.scrollIntoView({block:"start"}),0)}
    li.appendChild(d);box.appendChild(li);
  });
  openLesson=null;
}

/* ---------- 図解 ---------- */
const FIGS=window.FIGS||{};
function figsFor(cid,kind,key){return (FIGS[cid]||[]).filter(f=>kind==="lesson"?(f.lessons||[]).includes(key):(f.notes||[]).includes(key))}
function figHTML(f){const n=(f.steps||[]).length;
  return `<figure class="fig" data-fig="${esc(f.id)}"><div class="fhead"><b>図解</b><span>${esc(f.title)}</span></div>
  <div class="fsvg">${f.svg}</div>
  <figcaption class="fcap"><div class="ftext" aria-live="polite"></div>
  ${n>1?`<div class="fctl"><button data-a="prev">← 前</button><button class="pri" data-a="next">次へ →</button><button data-a="play">▶ 自動</button><button data-a="all">全部見る</button><span class="fdots">${f.steps.map(()=>"<i></i>").join("")}</span></div>`:""}</figcaption></figure>`}
function figInit(root,cid){root.querySelectorAll("figure.fig").forEach(el=>{
  const f=(FIGS[cid]||[]).find(x=>x.id===el.dataset.fig);if(!f)return;
  const svg=el.querySelector("svg");if(svg){svg.setAttribute("role","img");svg.setAttribute("aria-label",f.title)}
  const n=(f.steps||[]).length||1;let k=1,timer=null;
  const show=()=>{el.querySelectorAll("[data-s]").forEach(e=>{const s=+e.dataset.s;e.classList.toggle("f-hide",s>k);e.classList.toggle("now",s===k)});
    const st=f.steps&&f.steps[Math.min(k,n)-1];el.querySelector(".ftext").innerHTML=st?`<b class="mono" style="color:var(--mark)">${k}/${n}</b>　${rich(st.text)}`:"";
    el.querySelectorAll(".fdots i").forEach((d,i)=>d.classList.toggle("on",i<k));
    const pv=el.querySelector('[data-a="prev"]'),nx=el.querySelector('[data-a="next"]');if(pv)pv.disabled=k<=1;if(nx)nx.disabled=k>=n};
  const stop=()=>{if(timer){clearInterval(timer);timer=null;const b=el.querySelector('[data-a="play"]');if(b)b.textContent="▶ 自動"}};
  el.querySelectorAll(".fctl button").forEach(b=>b.onclick=()=>{const a=b.dataset.a;
    if(a==="prev"){stop();k=Math.max(1,k-1)}else if(a==="next"){stop();k=Math.min(n,k+1)}else if(a==="all"){stop();k=n}
    else if(a==="play"){if(timer){stop();return}if(k>=n)k=1;b.textContent="■ 止める";show();timer=setInterval(()=>{if(k>=n||!document.body.contains(el)){stop();return}k++;show()},3800);return}
    show()});
  show();
})}
function tabFigs(c,p){const list=FIGS[c.id]||[];const I=INTRO[c.id];
  const order=f=>Math.min(...(f.lessons&&f.lessons.length?f.lessons:[99]));

// 模試専用の問題（練習には出さない）。分野の配点どおりに、IDのハッシュで固定的に選ぶ
const RES={};
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function reserved(c){
  if(RES[c.id])return RES[c.id];
  const mk=MOCK[c.id]||{n:50};const tw=c.domains.reduce((a,d)=>a+d.weight,0);
  const want=Math.min(mk.n*2,Math.floor(c.questions.length*0.4));const set=new Set();
  c.domains.forEach(d=>{const k=Math.ceil(want*d.weight/tw);
    c.questions.filter(q=>q.domain===d.id).sort((a,b)=>hash(a.id)-hash(b.id)).slice(0,k).forEach(q=>set.add(q.id))});
  return RES[c.id]=set;
}
function pickByWeight(c,pool,n){
  const tw=c.domains.reduce((a,d)=>a+d.weight,0);let pick=[];const pools={};
  c.domains.forEach(d=>pools[d.id]=shuffle(pool.filter(q=>q.domain===d.id)));
  c.domains.forEach(d=>{const k=Math.round(n*d.weight/tw);pick.push(...pools[d.id].splice(0,k))});
  const rest=shuffle(Object.values(pools).flat());while(pick.length<n&&rest.length)pick.push(rest.pop());
  return pick.slice(0,n);
}

function tabPractice(c,p,s){
  const S=st(c.id);const R=reserved(c);
  const prac=c.questions.filter(q=>!R.has(q.id));
  const wrong=c.questions.filter(q=>S.q[q.id]&&!S.q[q.id].last);
  const unseen=prac.filter(q=>!S.q[q.id]);
  const flagged=c.questions.filter(q=>S.flags[q.id]);
  const mk=MOCK[c.id]||{n:50,secPerQ:90};
  const mockN=Math.min(mk.n,c.questions.length);
  const freshRes=c.questions.filter(q=>R.has(q.id)&&!S.q[q.id]);
  const freshAll=c.questions.filter(q=>!S.q[q.id]);
  const freshMocks=Math.floor(freshRes.length/mockN);
  const mockNote=freshAll.length>=mockN
    ?`初見の問題だけで <span class="mono">${mockN}</span> 問・時間制限あり。模試専用に取ってある問題からあと <b class="mono">${freshMocks}</b> 回分出せます`
    :`初見の問題が <span class="mono">${freshAll.length}</span> 問しか残っていません。足りない分は解いたことのある問題で補うので、点数は実力より高く出ます`;
  const perDom=d=>prac.filter(q=>q.domain===d.id).length;
  p.innerHTML=`<div class="modes">
    <button class="mode primary" id="m-unseen" ${unseen.length?"":"disabled"}><b>未回答から10問</b><span>まだ解いていない練習問題を優先。残り <span class="mono">${unseen.length}</span> 問</span></button>
    <button class="mode" id="m-wrong" ${wrong.length?"":"disabled"}><b>間違えた問題だけ</b><span>直近で不正解だった <span class="mono">${wrong.length}</span> 問を正解するまで</span></button>
    <button class="mode" id="m-rand"><b>ランダム10問</b><span>練習問題 <span class="mono">${prac.length}</span> 問からシャッフル</span></button>
    <button class="mode" id="m-flag" ${flagged.length?"":"disabled"}><b>後で見直す問題</b><span>フラグを付けた <span class="mono">${flagged.length}</span> 問</span></button>
    <button class="mode" id="m-mock"><b>模擬試験（初見）</b><span>${mockNote}</span></button>
  </div>
  <p class="hint">全 <b class="mono">${c.questions.length}</b> 問のうち <b class="mono">${R.size}</b> 問は模試専用で、練習には出ません。模試は解いたことのない問題から出すので、点数がそのまま実力の目安になります。目安は<b>初見の模試で80%以上を2回</b>です。</p>
  <div class="box"><h3>分野を選んで解く</h3>
    <div class="row"><select id="domSel">${c.domains.map(d=>`<option value="${d.id}">${esc(d.name)}（${perDom(d)}問）</option>`).join("")}</select>
    <button class="btn ghost" id="m-dom">この分野を全部解く</button></div></div>`;
  const start=(qs,opt)=>{if(!qs.length)return;session=Object.assign({qs,i:0,ans:{},checked:{},mock:false},opt||{});
    if(session.mock){session.end=Date.now()+session.secs*1000;startTimer(c)}render();window.scrollTo(0,0)};
  $("#m-unseen",p).onclick=()=>start(shuffle(unseen).slice(0,10),{label:"未回答から10問"});
  $("#m-wrong",p).onclick=()=>start(shuffle(wrong),{label:"間違えた問題"});
  $("#m-rand",p).onclick=()=>start(shuffle(prac).slice(0,10),{label:"ランダム10問"});
  $("#m-flag",p).onclick=()=>start(flagged,{label:"見直し"});
  $("#m-dom",p).onclick=()=>{const d=$("#domSel",p).value;start(shuffle(prac.filter(q=>q.domain===d)),{label:domName(c,d)})};
  $("#m-mock",p).onclick=()=>{
    // 初見の模試専用 → 初見の練習問題 → 解いたことのある問題（古い順）
    let pick=pickByWeight(c,freshRes,Math.min(mockN,freshRes.length));
    const used=new Set(pick.map(q=>q.id));
    if(pick.length<mockN)pick.push(...pickByWeight(c,freshAll.filter(q=>!used.has(q.id)),mockN-pick.length));
    pick.forEach(q=>used.add(q.id));
    const seenN=Math.max(0,mockN-pick.length);
    if(seenN)pick.push(...shuffle(c.questions.filter(q=>!used.has(q.id))).slice(0,seenN));
    pick=shuffle(pick);
    start(pick,{mock:true,label:seenN?`模擬試験（うち${seenN}問は解いたことのある問題）`:"模擬試験（初見）",secs:pick.length*mk.secPerQ,stale:seenN});
  };
}

function tabReport(c,p,s){
  const S=st(c.id);
  const rows=c.domains.map(d=>{const x=s.per[d.id];const acc=x.seen?x.ok/x.seen:0;const cov=x.n?x.seen/x.n:0;
    return `<div class="drow"><div><div class="lbl"><span>${esc(d.name)}</span><span class="muted mono">配点${d.weight}%</span></div>
      <div class="meter"><i style="width:${Math.round(acc*100)}%;background:${acc>=PASSLINE?"var(--ok)":acc>=.6?"var(--warn)":"var(--red)"}"></i><span class="line" style="left:${PASSLINE*100}%"></span></div>
      <div class="muted" style="font-size:11px">解いた ${x.seen}/${x.n} 問（網羅 ${Math.round(cov*100)}%）</div></div>
      <div class="pct">${x.seen?Math.round(acc*100)+"%":"—"}</div></div>`}).join("");
  const weak=c.domains.map(d=>({d,x:s.per[d.id]})).filter(o=>o.x.seen).sort((a,b)=>(a.x.ok/a.x.seen)-(b.x.ok/b.x.seen))[0];
  const mocks=(S.mocks||[]).slice(-6).reverse();
  p.innerHTML=`<div class="box"><h3>分野別の正解率（直近の解答）</h3><div class="drows">${rows}</div>
    ${weak&&weak.x.ok/weak.x.seen<PASSLINE?`<p style="margin:12px 0 0;font-size:14px">いちばん弱いのは <b>${esc(weak.d.name)}</b>。要点ノートのこの分野を読み直してから「分野を選んで解く」で回すのが近道です。</p>`:""}</div>
  <div class="box"><h3>模擬試験の記録</h3>${mocks.length?`<div class="tbl"><table><thead><tr><th>日時</th><th>正解</th><th>正解率</th><th>判定</th></tr></thead><tbody>${mocks.map(m=>`<tr><td class="mono">${esc(m.at)}</td><td class="mono">${m.ok}/${m.n}</td><td class="mono">${Math.round(m.ok/m.n*100)}%</td><td>${m.stale?'<span class="pill mid">参考（既出'+m.stale+'問）</span>':m.ok/m.n>=PASSLINE?'<span class="pill ok">合格圏</span>':m.ok/m.n>=.6?'<span class="pill mid">あと一歩</span>':'<span class="pill ng">要復習</span>'}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">まだ模擬試験を受けていません。ノートと分野別演習で全分野を一周したら受けてみてください。</div>'}
    <p class="muted" style="font-size:12px;margin:10px 0 0">目安: 初見の模擬試験で80%以上を2回続けて出せたら本番の申し込み時期です。既出問題が混ざった回は「参考」扱いです。本番は採点されない問題が混ざり、スコアは換算点なので、余裕を持たせています。</p></div>`;
}

/* ---------- session (解答画面) ---------- */
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function startTimer(c){stopTimer();timerId=setInterval(()=>{if(!session||!session.mock){stopTimer();return}
  const left=Math.max(0,Math.round((session.end-Date.now())/1000));const el=$("#timer");
  if(el){el.textContent=fmt(left);el.classList.toggle("low",left<300)}
  if(left<=0){stopTimer();finishMock(c)}},1000)}
function fmt(s){const m=Math.floor(s/60),x=s%60;return (m>=60?Math.floor(m/60)+":"+String(m%60).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")}

function record(c,q,ok){const S=st(c.id);const r=S.q[q.id]||{n:0,ok:0};r.n++;if(ok)r.ok++;r.last=ok;S.q[q.id]=r;persist(c.id)}

function renderSession(c){
  const ss=session;
  if(ss.done){renderResult(c);return}
  const q=ss.qs[ss.i];const need=q.answer.length;const sel=ss.ans[q.id]||[];const checked=ss.mock?false:ss.checked[q.id];
  const S=st(c.id);
  const ok=checked&&same(sel,q.answer);
  app.innerHTML=`<section class="panel" style="padding-top:18px">
  <div class="qhead"><span><span class="qno">問${ss.i+1}</span> / ${ss.qs.length}　${esc(ss.label)}</span>
    <span class="row">${ss.mock?`<span>残り <span class="timer" id="timer">${fmt(Math.max(0,Math.round((ss.end-Date.now())/1000)))}</span></span>`:""}
    <button class="flag" id="flag" aria-pressed="${!!S.flags[q.id]}">⚑ 後で見直す</button></span></div>
  <div class="box" style="display:flex;flex-direction:column;gap:14px">
    <div class="muted" style="font-size:12px"><span class="sw" style="background:${domColor(c,q.domain)}"></span> ${esc(domName(c,q.domain))}</div>
    <div class="qtext">${rt(q.q,c.id,new Set())}</div>
    ${need>1?`<div class="pick">${need}つ選んでください</div>`:""}
    <ul class="choices">${q.choices.map((ch,k)=>{let cls="choice";if(sel.includes(k))cls+=" sel";if(checked){if(q.answer.includes(k))cls+=" right";else if(sel.includes(k))cls+=" wrong"}
      return `<li><button class="${cls}" data-k="${k}" ${checked?"disabled":""}><span class="bubble">${LET[k]}</span><span>${rich(ch)}</span></button></li>`}).join("")}</ul>
    ${checked?`<div class="verdict"><div class="stamp ${ok?"":"x"}">${ok?"○":"×"}</div><div><b>${ok?"正解":"不正解"}</b><div class="muted" style="font-size:13px">正解: ${q.answer.map(a=>LET[a]).join("・")}</div></div></div>
      <div class="exp">${rt(q.exp,c.id,new Set())}</div>`:""}
    <div class="btns">
      ${!ss.mock&&!checked?`<button class="btn" id="check" ${sel.length===need?"":"disabled"}>解答する</button>`:""}
      ${ss.i>0?`<button class="btn ghost" id="prev">← 前へ</button>`:""}
      ${(ss.mock||checked)&&ss.i<ss.qs.length-1?`<button class="btn ${ss.mock?"ghost":""}" id="next">次へ →</button>`:""}
      ${(ss.mock||checked)&&ss.i===ss.qs.length-1?`<button class="btn" id="fin">${ss.mock?"採点する":"結果を見る"}</button>`:""}
      ${ss.mock&&ss.i<ss.qs.length-1?`<button class="btn" id="fin2">採点する</button>`:""}
      <button class="btn ghost" id="quit">やめる</button>
    </div>
  </div>
  ${ss.mock?`<div class="box"><h3 style="font-size:14px">解答状況</h3><div class="dots">${ss.qs.map((x,k)=>`<button data-j="${k}" class="${(ss.ans[x.id]||[]).length?"ans":""} ${k===ss.i?"cur":""} ${S.flags[x.id]?"flagged":""}" aria-label="問${k+1}">${k+1}</button>`).join("")}</div></div>`:""}
  </section>`;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;let a=(ss.ans[q.id]||[]).slice();
    if(need===1)a=[k];else{a=a.includes(k)?a.filter(x=>x!==k):(a.length<need?[...a,k]:a)}
    ss.ans[q.id]=a;renderSession(c)});
  const on=(id,f)=>{const e=$("#"+id);if(e)e.onclick=f};
  on("flag",()=>{S.flags[q.id]=!S.flags[q.id];if(!S.flags[q.id])delete S.flags[q.id];persist(c.id);renderSession(c)});
  on("check",()=>{ss.checked[q.id]=true;record(c,q,same(ss.ans[q.id]||[],q.answer));renderSession(c)});
  on("next",()=>{ss.i++;renderSession(c);window.scrollTo(0,0)});
  on("prev",()=>{ss.i--;renderSession(c);window.scrollTo(0,0)});
  const fin=()=>{if(ss.mock)finishMock(c);else{ss.done=true;renderSession(c);window.scrollTo(0,0)}};
  on("fin",fin);on("fin2",()=>{const left=ss.qs.filter(x=>!(ss.ans[x.id]||[]).length).length;
    const b=$("#fin2");if(left&&!b.dataset.armed){b.dataset.armed="1";b.textContent=`未回答が${left}問あります。もう一度押すと採点`;return}finishMock(c)});
  on("quit",()=>{const b=$("#quit");if(ss.mock&&!b.dataset.armed){b.dataset.armed="1";b.textContent="もう一度押すと中断（記録されません）";return}session=null;stopTimer();view.tab="practice";render()});
  app.querySelectorAll(".dots button").forEach(b=>b.onclick=()=>{ss.i=+b.dataset.j;renderSession(c)});
}

function finishMock(c){const ss=session;stopTimer();
  let ok=0;ss.qs.forEach(q=>{const r=same(ss.ans[q.id]||[],q.answer);if(r)ok++;record(c,q,r);ss.checked[q.id]=true});
  const d=new Date();const at=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  const S=st(c.id);S.mocks=(S.mocks||[]).concat([{at,ok,n:ss.qs.length,stale:ss.stale||0}]).slice(-20);persist(c.id);
  ss.done=true;render();window.scrollTo(0,0)}

function renderResult(c){
  const ss=session;const res=ss.qs.map(q=>({q,sel:ss.ans[q.id]||[],ok:same(ss.ans[q.id]||[],q.answer)}));
  const ok=res.filter(r=>r.ok).length,n=res.length,rate=n?ok/n:0;
  const per={};res.forEach(r=>{const p=per[r.q.domain]||(per[r.q.domain]={n:0,ok:0});p.n++;if(r.ok)p.ok++});
  app.innerHTML=`<section class="panel" style="padding-top:18px">
  <div class="box"><div class="score"><div class="big">${ok}<span style="font-size:20px" class="muted">/${n}</span></div>
    <div><div class="mono" style="font-size:20px">${Math.round(rate*100)}%</div>${rate>=PASSLINE?'<span class="pill ok">合格圏</span>':rate>=.6?'<span class="pill mid">あと一歩</span>':'<span class="pill ng">要復習</span>'}</div>
    <div class="muted" style="font-size:13px">${esc(ss.label)}</div></div>
    <div class="drows" style="margin-top:14px">${c.domains.filter(d=>per[d.id]).map(d=>{const x=per[d.id],a=x.ok/x.n;return `<div class="drow"><div><div class="lbl"><span>${esc(d.name)}</span><span class="muted mono">${x.ok}/${x.n}</span></div><div class="meter"><i style="width:${Math.round(a*100)}%;background:${a>=PASSLINE?"var(--ok)":a>=.6?"var(--warn)":"var(--red)"}"></i></div></div><div class="pct">${Math.round(a*100)}%</div></div>`}).join("")}</div>
    <div class="btns" style="margin-top:14px">${res.some(r=>!r.ok)?'<button class="btn" id="again">間違えた問題をもう一度</button>':""}<button class="btn ghost" id="back">演習メニューへ</button></div></div>
  <div class="box"><h3>答え合わせ</h3><div class="review">${res.map((r,k)=>`<details ${!r.ok&&ss.mock?"open":""}><summary><b style="color:${r.ok?"var(--ok)":"var(--red)"}">${r.ok?"○":"×"}</b> 問${k+1}　${esc(r.q.q.slice(0,46))}${r.q.q.length>46?"…":""}</summary>
    <div style="padding:8px 0;display:flex;flex-direction:column;gap:8px"><div class="qtext" style="font-size:14px">${rich(r.q.q)}</div>
    <ul class="choices">${r.q.choices.map((ch,j)=>`<li><div class="choice ${r.q.answer.includes(j)?"right":r.sel.includes(j)?"wrong":""}"><span class="bubble">${LET[j]}</span><span>${rich(ch)}</span></div></li>`).join("")}</ul>
    <div class="exp">${rich(r.q.exp)}</div></div></details>`).join("")}</div></div></section>`;
  const a=$("#again");if(a)a.onclick=()=>{session={qs:shuffle(res.filter(r=>!r.ok).map(r=>r.q)),i:0,ans:{},checked:{},mock:false,label:"間違えた問題"};render();window.scrollTo(0,0)};
  $("#back").onclick=()=>{session=null;view.tab="practice";render()};
}

/* ---------- boot ---------- */
const h=(location.hash||"").slice(1);
if(h&&CERTS[h])view.cert=h;
render();
})();
</script>

</body>
</html>
